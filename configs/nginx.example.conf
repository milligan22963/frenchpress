# Example nginx config routing known scanner paths to French Press
# and everything else to your real backend.
#
# Adjust the location blocks to match whatever bad-paths list you're
# actually running French Press with (configs/badpaths.example.yaml).

server {
    listen 80;
    server_name example.com;

    # Known scanner/exploit targets -> French Press tarpit.
    location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|\.env|\.git|phpmyadmin|administrator/index\.php|config\.json|\.aws|actuator|cgi-bin|console|telescope) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # Important: don't let nginx buffer or time out the slow-drip
        # response early.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Everything else -> your real site.
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
